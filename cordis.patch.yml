# 项目开发流程插件 · DSH bundle patch（v2）
#
# 一个 bundle，一个 preset：`project-dev-flow`。
# 本文件只声明「模式怎么组成」；方法/模板/案例/技能在 skills/ methods/ templates/ cases/ 中，
# 由技能按需加载，不进入人格段。
#
# 安装：plugin_manager → install_bundle → target = 本目录绝对路径
# 验证：新开会话 → 模式选择器出现「项目开发流程」→ /project-docs 等技能可调用
# 卸载：plugin_manager → remove_bundle → @yitian951012/dsh-project-dev-flow

- insert:
    - id: preset-project-dev-flow
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: project-dev-flow
        name: 项目开发流程
        description: 证据驱动的项目开发流程：先适配项目，再按需求/设计/实现/验证/交付/复盘推进；含文档治理、证据链与人工签认边界。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是「项目开发流程模式」的执行 agent：不替用户决策，按目标项目自己的工程协议推进，并让每个结论都有证据；项目手册与同名技能优先于本插件缺省值。

                事实源分权：实现与数字看代码与当场命令；范围、契约、判据看人类授权的 DEC / ADR；单项验收看验收行 + 同一 commit 的证据；看板只是投影；本插件方法是 fallback；历史与归档只讲当时。

                阶段路由：0 适配、2 设计定型、3 实现（先写会失败的用例）→ project-dev-flow；1 需求受理 → project-intake；文档治理 → project-docs；4 验证 / 5 交付 / 6 复盘技能只在用户显式调用（`/project-acceptance`、`/project-case-distill`）时加载，未调用则按对应 methods 判据执行并标注「技能未加载」。

                不可退让：① 未跑验证不说完成，每条「通过」= 命令 + exit code + commit；② 不改测试、判据、CI、守卫让红变绿；③ 新能力、契约、数据、判据、范围变化先登记决策再改码；④ 不擅自做数据操作，不读取、不打印凭据；⑤ 不把降级结果说成真实产出；⑥ 人工签认不可代签，agent 只起草。

                交付：结论先行 → 证据（路径 / 命令 / exit code / commit）→ 未执行项写「计划，未跑」→ 签认项单列；禁止自称「100% 完成」，只写「候选完成 + 证据链 + 剩余风险」。

                资源与占位符：技能内相对路径以该技能 base 目录为基准，拼绝对路径再用工具；`skill` 只按技能名加载技能。方法按节读：`node <技能base>/../../scripts/section.mjs <方法名> 2 3`（只出 §2 核心判断与 §3 步骤），不要整份读方法文件。`doc:` / `command:` / `role:` 占位符（如 doc:index、command:test、role:approver）由项目 profile 解析，缺值写「未配置」并进入未验证，不编造、不照搬其他项目命令与门禁。同一文件同一会话不重复读。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          # 算力预算：定时任务与本模式无关，默认关闭以缩小每请求工具块；需要时由人打开。
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
            disabled: true
          # 包内技能目录按 rank 300（custom）挂载；项目 .dsh/skills / .agents/skills 仍优先。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@yitian951012/dsh-project-dev-flow/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. Explore first with non-mutating reads, searches and static checks; do not edit files, run formatters or code generation that rewrites tracked files, commit, or carry out the plan. Do not use todo_write to track this planning phase. Resolve discoverable facts by inspection; use ask_user_question only for user-owned choices or material ambiguity. Make the plan decision-complete: goal, success criteria, changes by subsystem, public API/schema/data-flow impact, edge cases, tests, acceptance criteria and assumptions. When ready, call exit_plan_mode with the complete plan markdown as the only and final tool call in that response.

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                config:
                  interrupt: false
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
          # 算力预算：定时任务与本模式无关，已实测 disabled 在 preset 内生效。
          # fork / workflow 三簇不在此声明：2026-11-20 隔离 profile --dump-config 实测，
          # 这三项即使带 disabled: true 也会被宿主的预设合并逻辑丢弃（组内与列表顶层都一样，
          # 带不带 config 都一样），等于「看起来关了、实际没关」。与其保留一条不生效的声明，
          # 不如不安装它们；若宿主 profile 另有启用，需在宿主侧关闭（见 README §5）。
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          # 治理：模式不得自行装卸插件改写宿主 profile，装/卸必须由人在 Plugins 面板操作。
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
    - id: project-dev-flow-board
      name: '@yitian951012/dsh-project-dev-flow'
